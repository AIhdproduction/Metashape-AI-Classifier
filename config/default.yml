segmentation:
  backend: flurseg # flurseg (default, 11 fixed classes) or sam3 (editable text prompts).
metashape:
  exe: "C:/Program Files/Agisoft/Metashape Pro/metashape.exe" # Professional executable.
  chunks: [] # Empty selects all enabled chunks.
  imported_label: null # null follows the model: "FlurSeg classified" / "SAM3 classified".
  display_mode: image_colors # Preserve and show the original RGB colors from the project photographs.
  make_default: false # Keep the original default unless enabled.
  offscreen: auto # Windows uses -r alone if Qt offscreen is unavailable.
paths:
  model: "models/sam3.pt" # SAM 3 checkpoint; only needed for backend sam3, never downloaded.
  flurseg_model: "models/flurseg/v1" # Folder with config.json, model.safetensors, preprocessor_config.json.
  work_dir: "work" # Intermediate data, grouped by project path hash.
  output_dir: "output" # Final LAS and legends, grouped by project.
  image_path_remap: {} # Prefix mapping, e.g. {"D:/old/": "E:/new/"}.
gpu:
  device: "cuda:0" # CUDA device for production runs.
  dtype: "bfloat16" # SAM 3: bfloat16 or float16 autocast. FlurSeg uses flurseg.precision.
  min_vram_gb: 16 # SAM 3: warn below this many GiB.
flurseg:
  resolution: balanced # Long image side: fast 3200, balanced 4000, accurate original. Never upscaled.
  window_batch_size: 4 # 768-pixel windows per forward pass; halved automatically when VRAM runs out.
  precision: fp16 # fp16 autocast or fp32.
  background_threshold: 0.3 # Below this share of the normalised scores a pixel stays unknown.
  min_mask_confidence: 0.4 # Replaces visibility.min_mask_confidence while FlurSeg is selected.
sam:
  input_size: 1008 # SAM 3 tile size.
  prompt_batch_size: 8 # Text prompts per decoder batch; reduces runtime on 24 GiB GPUs.
  image_scale: 0.75 # Faster 75% image processing; retain enough detail for outdoor surveying.
  tile_overlap: 0.2 # Fraction shared by adjacent tiles.
  instance_conf_threshold: 0.3 # Minimum ungated instance confidence.
  background_threshold: 0.3 # Minimum fused pixel confidence.
cache:
  scale: 0.5 # Cached dimensions relative to the original image.
validation:
  max_reprojection_px: 0.5 # Hard maximum pixel error.
  max_tie_to_dense_m: 0.10 # Hard maximum median nearest distance.
  min_tie_points_inside_dense_share: 0.8 # Cropped clouds are valid when enough tie-point samples still overlap their extent.
visibility:
  mode: depth_maps # Export and use Metashape's calibrated depth map for each camera.
  zbuffer_scale: 0.5 # Fallback z-buffer resolution, relative to the original image.
  splat_px: 0 # Fallback depth test must not bleed across object boundaries.
  rel_tolerance: 0.005 # Fallback relative depth slack.
  abs_tolerance_m: 0.02 # Fallback absolute depth slack in metres.
  mask_interior_px: 2 # Cached-mask pixels required between a vote and every class boundary.
  min_mask_confidence: 0.5 # SAM 3: a pixel below this never votes. FlurSeg uses flurseg.min_mask_confidence.
  no_erosion_classes: [curb, road_marking, utility_cover] # Thin or small: eroding their masks leaves no vote.
voting:
  voxel_size_m: 0.03 # One original representative per metric voxel.
  block_size_m: 10.0 # Spatial block edge length in metres.
  min_views: 1 # One visible, positive-confidence observation is sufficient; confidence wins.
  min_share: 0.4 # Winning class weight / total weight.
  use_incidence_weight: false # Requires LAS normal extra dimensions.
  max_ram_gb: 16 # Vote-matrix memory budget in GiB.
  batch_points: 500000 # Bounded projection, I/O, and propagation batches.
  voxel_buckets: 256 # Disk partitions for bounded-memory voxel selection.
# Class names and codes from here on describe the SAM 3 classes. With FlurSeg selected,
# config/profile.flurseg.yml replaces these class-dependent entries; other values apply to both.
ground_assist:
  enabled: true # Metashape terrain is only used to resolve points that the model left unknown.
  classify_before_export: true # Run Metashape's ground classifier for Created and Unclassified source points.
  source_classes: [created, unclassified] # Never overwrite already classified source points.
  max_angle_degrees: 15
  max_distance_m: 0.3
  max_terrain_slope_degrees: 35
  cell_size_m: 10
  erosion_radius_m: 0.5
  ground_like_classes: [ground, road, sidewalk] # The model may choose freely among these surface classes.
  min_sam_ground_share: 0.15 # Use weak surface evidence only where the model otherwise remained unknown.
  min_sam_ground_views: 1
  fallback_class: ground # No surface evidence of the model: retain Metashape's terrain result as ground.
  fallback_confidence: 0.4
vegetation_assist:
  enabled: true # Use existing Metashape vegetation classes only where the model left a point unknown.
  source_low_codes: [3] # Metashape / ASPRS low vegetation.
  source_high_codes: [5] # Metashape / ASPRS high vegetation.
  low_vegetation_class: low_vegetation
  high_vegetation_class: tree
  fallback_confidence: 0.35 # The DTM post-filter determines the final low/high vegetation class.
smoothing:
  enabled: false # Optional voting-cloud kNN majority smoothing.
  k: 8 # Number of neighbours, including the point itself.
  max_share_to_change: 0.6 # Only change lower-share decided points.
  protected_classes: [curb, road_marking, utility_cover]
postprocess:
  enabled: true # Apply the configurable geometry and neighbourhood cleanup after voting.
  output_subdir: "post_sam_filter" # Per-chunk report folder below work/.
  neighborhood_radius_m: 0.35 # Metric neighbourhood for NPI outlier removal and hole filling.
  neighbors: 16 # Nearest neighbours inspected per representative point.
  protected_classes: [curb, road_marking, utility_cover] # Never absorbed by road, hole filling or geometry rules.
  compact_classes:
    # A manhole or drain cover is small and flat. A larger or non-flat group (drainage channels
    # along facades, containers) takes the class of its surroundings.
    utility_cover: {min_length_m: 0.2, max_length_m: 1.5, max_height_span_m: 0.15}
  geometry_rules:
    building:
      include_unknown: true # Restore unknown points only on a supported roof or facade plane.
      surfaces: [horizontal, vertical] # Fit roofs and facades separately.
  class_rules:
    ground: {min_same_neighbors: 5, fill_neighbors: 9, fill_share: 0.75, max_replaced_confidence: 0.55}
    road: {min_same_neighbors: 5, fill_neighbors: 9, fill_share: 0.8, max_replaced_confidence: 0.55}
    sidewalk: {min_same_neighbors: 4, fill_neighbors: 8, fill_share: 0.75, max_replaced_confidence: 0.5}
    curb: {min_same_neighbors: 2, fill_neighbors: 5, fill_share: 0.7, max_replaced_confidence: 0.45}
    road_marking: {min_same_neighbors: 2, fill_neighbors: 6, fill_share: 0.75, max_replaced_confidence: 0.4}
    utility_cover: {min_same_neighbors: 2, fill_neighbors: 5, fill_share: 0.7, max_replaced_confidence: 0.4}
    low_vegetation: {min_same_neighbors: 4, fill_neighbors: 8, fill_share: 0.75, max_replaced_confidence: 0.5}
    tree: {min_same_neighbors: 3, fill_neighbors: 7, fill_share: 0.7, max_replaced_confidence: 0.5}
    building: {min_same_neighbors: 5, fill_neighbors: 9, fill_share: 0.8, max_replaced_confidence: 0.6}
    vehicle: {min_same_neighbors: 2, fill_neighbors: 5, fill_share: 0.7, max_replaced_confidence: 0.45}
    construction_machinery: {min_same_neighbors: 2, fill_neighbors: 5, fill_share: 0.7, max_replaced_confidence: 0.45}
    utility_pole: {min_same_neighbors: 1, fill_neighbors: 4, fill_share: 0.7, max_replaced_confidence: 0.4}
    traffic_sign: {min_same_neighbors: 1, fill_neighbors: 4, fill_share: 0.7, max_replaced_confidence: 0.4}
    fence: {min_same_neighbors: 2, fill_neighbors: 5, fill_share: 0.7, max_replaced_confidence: 0.45}
    power_line: {min_same_neighbors: 1, fill_neighbors: 4, fill_share: 0.7, max_replaced_confidence: 0.4}
    scaffolding: {min_same_neighbors: 2, fill_neighbors: 5, fill_share: 0.7, max_replaced_confidence: 0.45}
    construction_material: {min_same_neighbors: 2, fill_neighbors: 5, fill_share: 0.7, max_replaced_confidence: 0.45}
    water: {min_same_neighbors: 4, fill_neighbors: 8, fill_share: 0.8, max_replaced_confidence: 0.45}
  cluster:
    enabled: true # Every semantic class needs a local point cluster; isolated or flying fragments become unclassified.
    radius_m: 0.45
    neighbors: 12
    min_same_neighbors: 4
    min_same_overrides: {curb: 2, road_marking: 2, utility_cover: 2}
  building:
    enabled: true
    ground_class: "ground"
    building_class: "building"
    horizontal_radius_m: 2.0 # Ground points high above several building points are flat-roof points, including roof interiors.
    min_vertical_drop_m: 1.0
    min_building_neighbors: 4
  ground:
    enabled: true
    ground_class: "ground"
    horizontal_radius_m: 0.75 # Ground reference is a local z=f(x,y) plane, preventing vertically stacked artefacts from validating themselves.
    neighbors: 16
    min_ground_neighbors: 8 # Sparse ground has no reliable local plane and is retained.
    max_plane_slope_degrees: 55 # Do not filter genuine steep terrain.
    max_offset_m: 0.15 # Points more than 15 cm above or below a supported ground plane become unclassified.
  vegetation:
    enabled: true
    low_vegetation_class: "low_vegetation"
    high_vegetation_class: "tree" # The existing tree class represents high vegetation.
    terrain_class_codes: [2, 9, 11, 73, 74, 75, 82] # Ground, water, road, sidewalk, curb, cover and marking support.
    fallback_terrain_class_codes: [14, 77] # Use power lines and guard rails only where trusted terrain has no support.
    dem_grid_size_m: 0.25 # The in-memory DTM mesh spacing in metres.
    max_dem_nodes: 500000 # Coarsens the grid automatically if a project has more nodes.
    interpolation_radius_m: 2.0
    interpolation_neighbors: 8
    min_dem_neighbors: 6
    max_dem_slope_degrees: 55
    max_dem_residual_m: 0.15
    high_vegetation_min_height_m: 0.5 # High vegetation at 50 cm above the DTM.
    threshold_tolerance: 0.1 # Keep the model's class inside the 45–55 cm transition band.
    sam_high_min_height_m: 0.4 # Strong hedge/tree evidence of the model may override a DTM only from 40 cm above terrain.
    sam_high_min_share: 0.65 # Flat grass stays low; this only preserves reliable high-vegetation mask shapes.
  dtm_ground:
    enabled: true # Low vegetation on a terrain model of the lowest points becomes ground (meadows).
    cell_size_m: 1.0 # One terrain node per cell: the point at the low height percentile below.
    percentile: 0.05
    max_height_m: 0.05 # Raise for more ground (8 cm: 87 % of a mown meadow), lower for less.
  unknown_fill:
    enabled: true # Extend a class only into immediately adjacent unclassified edge points.
    min_same_neighbors: 5
    min_share: 0.75 # At least 75% of local neighbours must agree on one class.
  planar_unknown_fill:
    enabled: true # Fill unknown edge points only when they lie on a local labelled surface plane.
    class_names: [ground, road, sidewalk, building]
    radius_m: 0.5
    neighbors: 16
    min_same_neighbors: 8
    min_planar_spread_m: 0.05
    max_plane_offset_m: 0.08
  road:
    enabled: true
    road_class: "road"
    max_slope_degrees: 40
    plane_neighbors: 12
    surface_radius_m: 1.5 # Close a false-class patch only when road points surround it in the XY plane.
    surface_neighbors: 24
    min_surface_road_neighbors: 12
    min_surface_coverage_sectors: 6 # Six of eight directions must contain road support; roadside grass is retained.
    max_surface_offset_m: 0.08 # Candidate must lie on the road plane, in metres.
    surface_replace_classes: [low_vegetation, sidewalk] # Restore road islands from these classes only when the road surrounds them.
    fill_unknown_surface: true # Restore unclassified points only inside a fully supported road plane.
debug:
  save_overlays: false # Draw validation projections on raw image pixels.
  overlay_every_n: 25 # Overlay every Nth exported camera.
